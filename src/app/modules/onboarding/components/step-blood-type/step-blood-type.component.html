<div [formGroup]="form" class="step">
  <h2 class="step__title">What's your blood type?</h2>
  <ion-item class="step__item">
    <ion-select
      formControlName="bloodType"
      label="BLOOD TYPE"
      labelPlacement="stacked"
      placeholder="Select"
    >
      @for (option of options; track option.value) {
        <ion-select-option [value]="option.value">{{
          option.label
        }}</ion-select-option>
      }
    </ion-select>
  </ion-item>
</div>
