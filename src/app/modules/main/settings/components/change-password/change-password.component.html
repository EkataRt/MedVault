<ion-header>
  <ion-toolbar>
    <ion-breadcrumbs>
      <ion-breadcrumb (click)="onBack()">Settings</ion-breadcrumb>
      <ion-breadcrumb>Change Password</ion-breadcrumb>
    </ion-breadcrumbs>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form [formGroup]="form" class="change-password">
    @if (errorMessage()) {
      <ion-note
        class="change-password__note change-password__note--error"
        color="danger"
      >
        <ion-icon name="alert-circle-outline" />
        {{ errorMessage() }}
      </ion-note>
    }

    @if (successMessage()) {
      <ion-note
        class="change-password__note change-password__note--success"
        color="success"
      >
        <ion-icon name="checkmark-circle-outline" />
        {{ successMessage() }}
      </ion-note>
    }

    <ion-list class="change-password__list" lines="none">
      <ion-item class="change-password__item">
        <ion-input
          formControlName="currentPassword"
          label="CURRENT PASSWORD"
          labelPlacement="stacked"
          placeholder="••••••••"
          type="password"
        />
      </ion-item>

      <ion-item class="change-password__item">
        <ion-input
          formControlName="newPassword"
          label="NEW PASSWORD"
          labelPlacement="stacked"
          placeholder="••••••••"
          type="password"
        />
      </ion-item>

      <ion-item class="change-password__item">
        <ion-input
          formControlName="confirmPassword"
          label="CONFIRM NEW PASSWORD"
          labelPlacement="stacked"
          placeholder="••••••••"
          type="password"
        />
      </ion-item>
    </ion-list>

    @if (form.hasError("mismatch") && form.get("confirmPassword")?.dirty) {
      <ion-note class="change-password__field-error" color="danger">
        Passwords do not match.
      </ion-note>
    }

    <ion-button
      class="change-password__submit"
      expand="block"
      [disabled]="form.invalid || isUpdating()"
      (click)="onSubmit()"
    >
      {{ isUpdating() ? "Updating..." : "Update Password" }}
    </ion-button>
  </form>
</ion-content>
