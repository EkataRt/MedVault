<ion-header>
  <ion-toolbar>
    <ion-breadcrumbs>
      <ion-breadcrumb>Settings</ion-breadcrumb>
    </ion-breadcrumbs>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="settings">
    <ion-list class="settings__list" lines="none">
      <ion-item
        class="settings__item settings__item--nav"
        button
        detail
        (click)="onNavigate('edit-profile')"
      >
        <ion-icon name="person-outline" slot="start" class="settings__icon" />
        <ion-label>Edit Profile</ion-label>
      </ion-item>

      <ion-item
        class="settings__item settings__item--nav"
        button
        detail
        (click)="onNavigate('change-password')"
      >
        <ion-icon
          name="lock-closed-outline"
          slot="start"
          class="settings__icon"
        />
        <ion-label>Change Password</ion-label>
      </ion-item>

      <ion-item
        class="settings__item settings__item--nav"
        button
        detail
        (click)="onNavigate('delete-account')"
      >
        <ion-icon
          name="trash-outline"
          slot="start"
          class="settings__icon settings__icon--danger"
        />
        <ion-label class="settings__label--danger">Delete Account</ion-label>
      </ion-item>
    </ion-list>

    <ion-list class="settings__list" lines="none">
      <ion-item class="settings__item">
        <ion-icon name="moon-outline" slot="start" class="settings__icon" />
        <ion-label>Dark Mode</ion-label>
        <ion-toggle
          slot="end"
          [checked]="isDarkMode()"
          (ionChange)="onDarkModeToggle($any($event))"
        />
      </ion-item>

      <ion-item
        class="settings__item settings__item--logout"
        button
        (click)="onLogout()"
      >
        <ion-icon
          name="log-out-outline"
          slot="start"
          class="settings__icon settings__icon--logout"
        />
        <ion-label class="settings__label--logout">Log Out</ion-label>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
