<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/main/dashboard" />
    </ion-buttons>
    <ion-breadcrumbs>
      <ion-breadcrumb>BMI History</ion-breadcrumb>
    </ion-breadcrumbs>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="bmi-history">
    @if (isLoading()) {
    <div class="bmi-history__loading">
      <ion-spinner name="crescent" />
    </div>
    } @else if (!history().length) {
    <div class="bmi-history__empty">
      <ion-icon name="analytics-outline" />
      <p>No BMI history recorded yet.</p>
    </div>
    } @else {
    <table class="bmi-history__table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Height (cm)</th>
          <th>Weight (kg)</th>
          <th>BMI</th>
        </tr>
      </thead>
      <tbody>
        @for (entry of history(); track entry.recordedAt) {
        <tr>
          <td>{{ entry.recordedAt | date: 'mediumDate' }}</td>
          <td>{{ entry.height }}</td>
          <td>{{ entry.weight }}</td>
          <td>{{ entry.bmi }}</td>
        </tr>
        }
      </tbody>
    </table>
    }
  </div>
</ion-content>
