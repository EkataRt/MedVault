<ion-item-sliding>
  <ion-item class="document-item" button detail="false" (click)="onCardClick()">
    <!-- Thumbnail Slot -->
    <div class="document-thumb" slot="start">
      <ng-container *ngIf="isPdf(); else imageThumb">
        <ion-icon name="document-text-outline" class="pdf-icon"></ion-icon>
      </ng-container>

      <ng-template #imageThumb>
        <img [src]="document().url" [alt]="document().name" />
      </ng-template>
    </div>

    <ion-label>
      <div class="title-row">
        <h3 class="document-name">{{ document().name }}</h3>

        <ion-badge
          *ngIf="document().reportType"
          color="tertiary"
          class="metadata-badge"
        >
          {{ document().reportType }}
        </ion-badge>
      </div>

      <div class="sub-row">
        <p class="document-date">{{ displayDate() }}</p>

        <ion-badge
          *ngIf="document().processingStatus"
          [color]="getStatusColor(document().processingStatus!)"
          class="status-badge"
        >
          {{ document().processingStatus }}
        </ion-badge>
      </div>
    </ion-label>

    <ion-icon name="chevron-forward-outline" slot="end" class="chevron" />
  </ion-item>

  <ion-item-options side="end">
    <ion-item-option color="primary" (click)="onRename()">
      <ion-icon slot="top" name="pencil-outline" />
      Rename
    </ion-item-option>
    <ion-item-option color="danger" (click)="onDelete()">
      <ion-icon slot="top" name="trash-outline" />
      Delete
    </ion-item-option>
  </ion-item-options>
</ion-item-sliding>
