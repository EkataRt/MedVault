<ion-modal [isOpen]="isOpen()" (didDismiss)="onDismiss()">
  <ng-template>
    <ion-header>
      <ion-toolbar class="preview-toolbar">
        <ion-title class="preview-title">{{ document()?.name }}</ion-title>
        <ion-buttons slot="end">
          <ion-button fill="clear" (click)="onDismiss()">
            <ion-icon name="close-outline" slot="icon-only" />
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="preview-content">
      @if (document()) {
        <div class="image-wrapper">
          <img
            class="preview-image"
            [src]="document()?.url"
            [alt]="document()?.name"
          />
        </div>
      }
    </ion-content>

    <ion-footer>
      <ion-toolbar class="footer-toolbar">
        @if (document()) {
          <div class="footer-content">
            <span class="upload-date">
              <ion-icon name="calendar-outline" />
              {{ formatDate(document()?.uploadedAt ?? '') }}
            </span>
            <ion-button
              fill="clear"
              color="danger"
              class="delete-btn"
              (click)="onDelete()"
            >
              <ion-icon name="trash-outline" slot="start" />
              Delete
            </ion-button>
          </div>
        }
      </ion-toolbar>
    </ion-footer>
  </ng-template>
</ion-modal>
