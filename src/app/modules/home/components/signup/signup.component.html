<div class="signup-container">
  <div class="signup-card">
    <div class="card-header">
      <div class="icon-wrapper">
        <ion-icon name="person-add-outline" />
      </div>
      <h2>Create account</h2>
      <p>Join MedVault today</p>
    </div>

    <div class="form-fields">
      <ion-input
        fill="outline"
        label="Email"
        labelPlacement="floating"
        type="email"
        [value]="email()"
        (ionInput)="email.set($event.detail.value ?? '')"
      >
        <ion-icon name="mail-outline" slot="start" />
      </ion-input>

      <ion-input
        fill="outline"
        label="Username"
        labelPlacement="floating"
        type="text"
        [value]="username()"
        (ionInput)="username.set($event.detail.value ?? '')"
      >
        <ion-icon name="person-outline" slot="start" />
      </ion-input>

      <ion-input
        fill="outline"
        label="Password"
        labelPlacement="floating"
        type="password"
        [value]="password()"
        (ionInput)="password.set($event.detail.value ?? '')"
      >
        <ion-icon name="lock-closed-outline" slot="start" />
      </ion-input>

      <ion-input
        fill="outline"
        label="Confirm Password"
        labelPlacement="floating"
        type="password"
        [value]="confirmPassword()"
        (ionInput)="confirmPassword.set($event.detail.value ?? '')"
      >
        <ion-icon name="lock-closed-outline" slot="start" />
      </ion-input>
    </div>

    @if (errorMessage()) {
      <p class="error-message">{{ errorMessage() }}</p>
    }

    <ion-button expand="block" [disabled]="isLoading()" (click)="onSignup()">
      @if (isLoading()) {
        <ion-spinner name="crescent" />
      } @else {
        Create Account
      }
    </ion-button>

    <p class="switch-auth">
      Already have an account?
      <a routerLink="/home/login">Log In</a>
    </p>
  </div>
</div>
